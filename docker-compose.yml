services:
  postgres:
    image: postgres:16-alpine
    container_name: krynon-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krynon-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - IP=[IP_ADDRESS]
      - PORT=8080
    ports:
      - "${APP_PORT:-8080}:8080"
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - target/
            - .git/
            - .sqlx/

  # Web UI for inspecting and managing the PostgreSQL database.
  # Default login: System = PostgreSQL, Server = postgres, Username/Password = .env values.
  adminer:
    image: adminer:latest
    container_name: krynon-adminer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    restart: unless-stopped


volumes:
  pgdata:
