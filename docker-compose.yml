services:
  postgres:
    image: postgres:16-alpine
    container_name: krynon-postgres
    environment:
      POSTGRES_USER: krynon
      POSTGRES_PASSWORD: krynon_password
      POSTGRES_DB: krynon_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krynon -d krynon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
