[package]
name = "krynon"
version = "0.1.0"
authors = ["Vivelis"]
edition = "2021"
repository = "https://github.com/Holobion/Krynon"
homepage = "https://github.com/Holobion/Krynon"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Optional dependencies, enabled via features
sqlx = { version = "0.8.0", features = ["runtime-tokio", "postgres", "macros", "json"], optional = true }
dotenvy = { version = "0.15.7", optional = true }
tokio = { version = "1.37", default-features = false, features = ["sync"], optional = true } # Disable default features for WASM compatibility

# Core dependencies
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
serde = { version = "1.0.228", features = ["derive"] }

[features]
default = ["web", "server"]

# Web target features (currently not the focus)
web = ["dioxus/web"]

# Desktop target features
desktop = ["dioxus/desktop"]

# Mobile target features
mobile = ["dioxus/mobile"]

# Server target features
server = ["dioxus/server", "dep:sqlx", "dep:dotenvy", "dep:tokio"]
